name: reproducible-analytical-benchmark
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run benchmark:full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytical-benchmark-with-provenance
          path: output/benchmark
