name: scientific-core
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: node scripts/check-manual.mjs
      - run: git diff --exit-code -- plugins/th-msm
      - run: npm run pack:codex
      - run: node scripts/smoke-codex-package.mjs dist/th-msm-codex-plugin-$(node -p "require('./package.json').version").tar.gz
      - run: npm run demo
      - run: npm run demo:msm
      - run: npm pack
      - run: node scripts/smoke-package.mjs th-msm-dsh-plugin-$(node -p "require('./package.json').version").tgz
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            *.tgz
            dist/*.tar.gz
