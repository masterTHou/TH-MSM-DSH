<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">A two-state model you can verify by hand</title><desc id="desc">A to B probability 0.1, B to A 0.2, stationary populations two thirds and one third, mean first passage A to B ten steps.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5886a1"/></marker></defs>
  <rect width="1000" height="250" rx="18" fill="#f1f6fa"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="36" y="40" fill="#193345" font-size="18" font-weight="600">A small model. Answers you can check.</text>
    <circle cx="145" cy="140" r="55" fill="#dbf5ec" stroke="#42967c" stroke-width="2"/>
    <circle cx="430" cy="140" r="43" fill="#e2eafa" stroke="#6584bb" stroke-width="2"/>
    <text x="145" y="140" text-anchor="middle" fill="#215b49" font-size="26">A</text><text x="145" y="164" text-anchor="middle" fill="#215b49" font-size="16">π = 2/3</text>
    <text x="430" y="139" text-anchor="middle" fill="#31558c" font-size="26">B</text><text x="430" y="160" text-anchor="middle" fill="#31558c" font-size="16">π = 1/3</text>
    <path d="M197 116Q290 64 388 116" fill="none" stroke="#5886a1" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M388 164Q290 215 200 164" fill="none" stroke="#5886a1" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="280" y="90" fill="#3b6178" font-size="17">0.1</text><text x="280" y="211" fill="#3b6178" font-size="17">0.2</text>
    <path d="M550 75V211" stroke="#cbdce7"/>
    <text x="590" y="103" fill="#193345" font-size="18">Slow decay time ≈ 2.804 steps</text>
    <text x="590" y="144" fill="#193345" font-size="18">Mean first passage A → B = 10 steps</text>
    <text x="590" y="186" fill="#647e90" font-size="14">Analytical reference for the synthetic demo.</text>
    <text x="590" y="207" fill="#647e90" font-size="14">Finite trajectory estimates fluctuate around it.</text>
  </g>
</svg>
